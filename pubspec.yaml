name: inspired
description: "Inspire Africa Group — employee mobile app (attendance, leave, requests, projects)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management + routing
  flutter_riverpod: ^2.5.1
  go_router: ^16.0.0

  # HTTP + secure storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # Auth
  google_sign_in: ^6.2.1

  # Device APIs (used at explicit user actions only — see docs/SPRINT_0.md §12a)
  geolocator: ^14.0.0
  network_info_plus: ^6.0.1
  connectivity_plus: ^6.0.5
  permission_handler: ^12.0.0
  package_info_plus: ^8.0.2

  # Offline queue + persistence
  sqflite: ^2.4.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # Utilities
  intl: ^0.19.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "images/africa_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "images/africa_icon_fg.png"
  web:
    generate: true
    image_path: "images/africa_icon.png"
  background_color_web: "#ffffff"
  theme_color_web: "#00843A"

flutter:
  uses-material-design: true
  assets:
    - images/Inspire.png
    - images/africa_mark.png
  fonts:
    - family: Inter
      fonts:
        # Variable font: Flutter maps TextStyle.fontWeight onto the wght axis.
        - asset: fonts/Inter.ttf
